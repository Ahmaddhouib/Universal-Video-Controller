  </defs>
  
  <circle cx="64" cy="64" r="58" fill="url(#bgGrad)" stroke="#3b4261" stroke-width="2"/>
  <circle cx="64" cy="64" r="52" fill="#1e2030" stroke="#2a2e45" stroke-width="1.5"/>
  
  <circle cx="64" cy="64" r="42" fill="url(#purpleTurquoiseGrad)" opacity="0.95"/>
  <line x1="22" y1="64" x2="106" y2="64" stroke="rgba(15, 17, 26, 0.4)" stroke-width="1.5"/>
  
  <circle cx="64" cy="64" r="24" fill="#0f111a" stroke="#ffffff" stroke-width="2" filter="url(#glow)"/>
  
  <polygon points="58,52 58,76 78,64" fill="#ffffff"/>
